apiVersion: v1
kind: Service
metadata:
  name: fleet-test-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: fleet-test  # This MUST match the label in your deployment.yaml
  ports:
    - protocol: TCP
      port: 80        # Port inside the cluster
      targetPort: 80  # Port on the container
      nodePort: 30080 # Port you will use in your browser